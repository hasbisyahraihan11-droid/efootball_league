<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eFootball League</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <aside class="sidebar">
    <div class="logo">
      <div class="logo-ball">⚽</div>
      <div>
        <strong>eFOOTBALL</strong>
        <span>LEAGUE</span>
      </div>
    </div>

    <nav>
      <button class="nav-btn active" onclick="showPage('home', this)">🏠 Home</button>
      <button class="nav-btn" onclick="showPage('table', this)">🏆 Klasemen</button>
      <button class="nav-btn" onclick="showPage('matches', this)">⚽ Pertandingan</button>
      <button class="nav-btn" onclick="showPage('admin', this)">🔐 Admin</button>
    </nav>

    <div class="sidebar-bottom">
      <span>LIVE LEAGUE</span>
      <small>Powered by Supabase</small>
    </div>
  </aside>

  <main class="main">

    <!-- HOME -->
    <section id="home" class="page active">
      <div class="hero">
        <div class="hero-content">
          <span class="hero-tag">⚡ SEASON 2026</span>
          <h1>eFOOTBALL<br><span>LEAGUE</span></h1>
          <p>Kompetisi eFootball dengan sistem klasemen dan pertandingan realtime.</p>

          <button class="hero-button" onclick="showPage('table')">
            LIHAT KLASEMEN →
          </button>
        </div>

        <div class="hero-ball">⚽</div>
      </div>

      <div class="stats">
        <div class="stat-card">
          <span>⚽</span>
          <div>
            <small>TOTAL MATCH</small>
            <strong id="totalMatches">0</strong>
          </div>
        </div>

        <div class="stat-card">
          <span>👥</span>
          <div>
            <small>TOTAL TEAM</small>
            <strong id="totalTeams">0</strong>
          </div>
        </div>

        <div class="stat-card">
          <span>🔥</span>
          <div>
            <small>STATUS</small>
            <strong class="live-text">LIVE</strong>
          </div>
        </div>
