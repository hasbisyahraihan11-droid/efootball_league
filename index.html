<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Komunitas eFootball ID</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <aside class="sidebar">

    <h2>⚽ eFootball ID</h2>

    <button onclick="showPage('home')">
      🏠 HOME
    </button>

    <button onclick="showPage('ranking')">
      🏆 RANKING
    </button>

    <button onclick="showPage('matches')">
      ⚽ MATCHES
    </button>

    <button onclick="showPage('admin')">
      ⚙️ ADMIN
    </button>

  </aside>


  <main class="main">

    <!-- HOME -->
    <section id="home" class="page active">

      <div class="hero">

        <p>WELCOME TO</p>

        <h1>KOMUNITAS<br>eFOOTBALL ID</h1>

        <p>
          Tempat bermain, bertanding dan bersaing
          bersama komunitas eFootball.
        </p>

      </div>

    </section>


    <!-- RANKING -->
    <section id="ranking" class="page">

      <h1>🏆 Ranking</h1>

      <div id="rankingList">
        <p>Memuat ranking...</p>
      </div>

    </section>


    <!-- MATCHES -->
    <section id="matches" class="page">

      <h1>⚽ Recent Matches</h1>

      <div id="matchList">
        <p>Memuat pertandingan...</p>
      </div>

    </section>


    <!-- ADMIN -->
    <section id="admin" class="page">

      <h1>⚙️ Tambah Pertandingan</h1>

      <div class="form">

        <input
          type="text"
          id="team1"
          placeholder="Nama Team 1"
        >

        <input
          type="number"
          id="score1"
          placeholder="Score Team 1"
          min="0"
        >

        <input
          type="number"
          id="score2"
          placeholder="Score Team 2"
          min="0"
        >

        <input
          type="text"
          id="team2"
          placeholder="Nama Team 2"
        >

        <button onclick="addMatch()">
          ➕ TAMBAH MATCH
        </button>

        <p id="message"></p>

      </div>

    </section>

  </main>


  <script src="app.js"></script>

</body>
</html>
